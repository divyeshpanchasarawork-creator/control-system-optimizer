spring.application.name=control-system-optimizer
server.port=${PORT:8080}

# Framework defaults (overridable via request fields)
control.simulation.default-end-time=10.0
control.simulation.default-time-step=0.01
control.differential-evolution.population-scale=20
control.differential-evolution.max-iterations=1000
control.differential-evolution.differential-weight=0.5
control.differential-evolution.crossover-rate=0.9
control.default-seed=42